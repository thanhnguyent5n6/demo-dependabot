version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "10:51"
      timezone: "Asia/Ho_Chi_Minh"

  - package-ecosystem: "npm"
    directory: "/javascript"
    schedule:
      interval: daily
      time: "10:51"
      timezone: "Asia/Ho_Chi_Minh"

  - package-ecosystem: "bundler"
    directory: "/ruby"
    schedule:
      interval: daily
      time: "10:51"
      timezone: "Asia/Ho_Chi_Minh"
