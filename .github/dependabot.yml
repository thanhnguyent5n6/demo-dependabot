version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "11:05"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1

  - package-ecosystem: "npm"
    directory: "/javascript"
    schedule:
      interval: daily
      time: "11:05"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1

  - package-ecosystem: "bundler"
    directory: "/ruby"
    schedule:
      interval: daily
      time: "11:05"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
